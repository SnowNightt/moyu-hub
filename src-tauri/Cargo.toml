[package]
name = "moyu-hub"
version = "0.1.0"
description = "MoyuHub desktop workbench"
edition = "2021"

[lib]
name = "moyu_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
chardetng = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

