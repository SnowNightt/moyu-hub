schema: spec-driven

context: |
  使用简体中文编写变更文档，保留 spec-driven schema 所需的机器可识别标题和结构。
  首版以 Windows 桌面为主要交付与验证平台；其他平台支持必须在相关变更中明确范围与证据。
  已确认的原型仅以应用部分为视觉参考，原型背景不进入正式应用；用户后续明确要求优先于旧材料。
  未接入服务保持明确的未接入状态，正式服务不使用演示数据或测试 fixture 冒充真实业务。
  应用不携带共享 Steam API Key 或其他服务密钥；凭据不得进入仓库、前端包或日志。
  原有本地需求、设计和评估材料是输入；尚未迁移的功能需核对用户已确认要求，不能仅凭代码认定预期行为。
  用户明确确认的要求无需重复批准；关键行为歧义先澄清，未回复不算同意。

rules:
  proposal:
    - 区分当前已实现状态、目标能力与未验证假设；不将历史评估写成接入完成。
  design:
    - 涉及数据源、文件、数据库或原生窗口时，说明服务边界、权限、持久化与兼容影响。
  tasks:
    - 包含受影响测试、必要的真实桌面验收与相关工程文档更新；不默认安排全量测试。
